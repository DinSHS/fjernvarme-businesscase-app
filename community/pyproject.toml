[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fjernvarme-app"
dynamic = ["version"]
description = "Lokal brugerflade til fjernvarme-businesscase-modellen (github.com/skj-1964/fjernvarme-businesscase, MIT)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Modellens egne pins (modelrepoets requirements.txt ved den pinnede commit). Uden dem bygger motoren selv et
# venv med requirements.txt ved første kørsel (kræver net).
model = [
    "linopy==0.10.0",
    "highspy==1.15.1",
    "xarray>=2023.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "netCDF4>=1.6",
    "requests>=2.34",
]
postgresql = ["psycopg[binary]>=3.1"]
mssql = ["pyodbc>=5.0"]

[project.scripts]
fjernvarme_app = "fjernvarme_app.cli:main"

[project.urls]
"Modellen (oprindelig case)" = "https://github.com/skj-1964/fjernvarme-businesscase"
"Data" = "https://github.com/skj-1964/df-data"

[tool.setuptools.dynamic]
version = { attr = "fjernvarme_app.__version__" }

[tool.setuptools.packages.find]
include = ["fjernvarme_app*"]
exclude = ["fjernvarme_app.logik.tests*"]

[tool.setuptools.package-data]
"fjernvarme_app" = [
    "_motor/*.json", "_motor/fjv/*.py", "_motor/fjv/*.json",
    "viden/*.json", "viden/vaerktoej/*.py",
    "_ressourcer/**/*", "web/**/*",
]
